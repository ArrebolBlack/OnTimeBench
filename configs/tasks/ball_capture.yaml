schema_version: 1
variant: unsupported_sphere
bindings:
  target_object_id: target
  ramp_fixture_id: ramp
  release_gate_fixture_id: gate
  downstream_surface_fixture_id: safety_tray
allowed_observation_profiles:
  - agentview
  - agentview_wrist
allowed_action_modes:
  - E7
  - J8
episode_horizon_steps: 120
success:
  require_contact_after_ramp_exit: true
  require_contact_before_tray: true
  bilateral_contact_duration_s: 0.025
  minimum_lift_or_clearance_m: 0.05
  stable_hold_duration_s: 0.50
metrics:
  - success_rate
  - task_completion
  - completion_time_s
  - safety_failure_rate
  - failure_rate
